# 局域网访问版：在 nginx.mobile-dev.conf 基础上增加 443/HTTPS。
# 由 compose.mobile-dev.lan.yaml 挂载使用；证书见 deploy/certs/README.md。
# HTTPS 是必须的：浏览器只在安全上下文（HTTPS/localhost）下开放 WebCodecs，
# 局域网 HTTP 访问时 H.264 解码不可用，只能回退 MJPEG。
user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    upstream control_api_upstream { server control-api:8088; }
    server {
        listen 80;
        server_name localhost jingcang.localhost;
        location / {
            proxy_pass http://control_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/mobile/ {
            proxy_pass http://control_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 190s;
            proxy_send_timeout 190s;
        }
        location /api/ {
            proxy_pass http://control_api_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /viewer/ {
            proxy_pass http://control_api_upstream/viewer/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /artifacts/ { proxy_pass http://control_api_upstream/artifacts/; }
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/jingcang-lan.pem;
        ssl_certificate_key /etc/nginx/certs/jingcang-lan-key.pem;
        location / {
            proxy_pass http://control_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v1/mobile/ {
            proxy_pass http://control_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 190s;
            proxy_send_timeout 190s;
        }
        location /api/ {
            proxy_pass http://control_api_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /viewer/ {
            proxy_pass http://control_api_upstream/viewer/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /artifacts/ { proxy_pass http://control_api_upstream/artifacts/; }
    }
}
