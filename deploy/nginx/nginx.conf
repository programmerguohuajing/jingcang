user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream control_api_upstream {
        server control-api:8088;
    }

    server {
        listen 80;
        server_name localhost jingcang.localhost;

        # Web Console & Static frontend
        location / {
            proxy_pass http://control_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Session API
        location /api/ {
            proxy_pass http://control_api_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Viewer WebSocket & noVNC proxy
        location /viewer/ {
            proxy_pass http://control_api_upstream/viewer/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Test Artifacts
        location /artifacts/ {
            proxy_pass http://control_api_upstream/artifacts/;
        }
    }
}
