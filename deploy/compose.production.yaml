name: jingcang-production

services:
  gateway:
    image: nginx@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    ports:
      - "${JINGCANG_BIND_HOST:-0.0.0.0}:${JINGCANG_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      control-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  control-api:
    image: jingcang/control-api:${JINGCANG_IMAGE_TAG:-1.3.0}
    build:
      context: ..
      dockerfile: apps/control-api/Dockerfile.production
      args:
        VERSION: ${JINGCANG_IMAGE_TAG:-1.3.0}
        VCS_REF: ${JINGCANG_VCS_REF:-unknown}
        BUILD_DATE: ${JINGCANG_BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      JINGCANG_ROOT: /app
      JINGCANG_CONTAINERIZED: "true"
      JINGCANG_PORT: "8088"
      JINGCANG_BIND_HOST: 0.0.0.0
      JINGCANG_GRID_URL: http://selenium-docker:4444
      JINGCANG_SQLITE_JOURNAL_MODE: WAL
      JINGCANG_TRUST_PROXY: "true"
      JINGCANG_LAN_ACCESS_ENABLED: ${JINGCANG_LAN_ACCESS_ENABLED:-true}
      JINGCANG_BROWSER_COMPOSE_PROJECT: ${JINGCANG_BROWSER_COMPOSE_PROJECT:-jingcang-poc}
      JINGCANG_BROWSER_COMPOSE_NETWORK: ${JINGCANG_BROWSER_COMPOSE_NETWORK:-jingcang_poc}
      JINGCANG_BROWSER_IMAGE_REPOSITORY_PREFIX: ${JINGCANG_BROWSER_IMAGE_REPOSITORY_PREFIX:-selenium}
      JINGCANG_BROWSER_REGISTRY_SERVER: "${JINGCANG_BROWSER_REGISTRY_SERVER:-}"
      JINGCANG_BROWSER_REGISTRY_USERNAME: "${JINGCANG_BROWSER_REGISTRY_USERNAME:-}"
      JINGCANG_BROWSER_REGISTRY_PASSWORD: "${JINGCANG_BROWSER_REGISTRY_PASSWORD:-}"
      JINGCANG_BROWSER_IMAGE_ARCHIVE_DIR: /app/browser-images
      JINGCANG_BROWSER_OFFLINE_MODE: ${JINGCANG_BROWSER_OFFLINE_MODE:-false}
      JINGCANG_BROWSER_AUTO_SYNC_LOCAL_IMAGES: "${JINGCANG_BROWSER_AUTO_SYNC_LOCAL_IMAGES:-}"
      JINGCANG_BROWSER_IMAGE_SCAN_INTERVAL_SECONDS: ${JINGCANG_BROWSER_IMAGE_SCAN_INTERVAL_SECONDS:-30}
    volumes:
      - jingcang_db:/app/data/db
      - jingcang_artifacts:/app/data/artifacts
      - jingcang_logs:/app/data/logs
      - ./browser-images:/app/browser-images:ro
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      selenium-docker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8088/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5
    networks:
      - frontend
      - backend

  browser-preload:
    image: jingcang/browser-bundle:${JINGCANG_BROWSER_BUNDLE_TAG:-1.2.1}
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  selenium-docker:
    image: selenium/standalone-docker@sha256:9f8a98a4c66343705b54bca00156681e30608eae41e9b1228c6004c8b2dc0248
    restart: unless-stopped
    depends_on:
      browser-preload:
        condition: service_completed_successfully
    environment:
      SE_NODE_DOCKER_CONFIG_FILENAME: docker.toml
      SE_NODE_MAX_SESSIONS: ${JINGCANG_SESSION_MAX_CONCURRENCY:-4}
      SE_NODE_SESSION_TIMEOUT: ${JINGCANG_SELENIUM_SESSION_TIMEOUT:-7200}
      SE_NODE_GRID_URL: http://selenium-docker:4444
      SE_VNC_NO_PASSWORD: "true"
      SE_START_VNC: "true"
    volumes:
      - ./selenium/docker.production.toml:/opt/selenium/docker.toml:ro
      - jingcang_artifacts:/opt/selenium/assets
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:4444/status |
          grep -q '"ready"[[:space:]]*:[[:space:]]*true'
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 6
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  jingcang_db:
    name: jingcang_prod_db
  jingcang_artifacts:
    name: jingcang_prod_artifacts
  jingcang_logs:
    name: jingcang_prod_logs
