name: CI

on:
  push:
    branches: [main, master, feat/**, fix/**]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 验证门禁：lint → build → 契约测试 → 单元/集成测试
  # ---------------------------------------------------------------------------
  verify:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc --noEmit)
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Contract tests (device-contracts 契约门禁)
        run: pnpm --filter @jingcang/device-contracts test

      - name: Unit & integration tests
        run: pnpm -r test

      - name: Integration tests (explicit gate)
        run: pnpm --filter @jingcang/control-api exec node --test "dist/**/*.integration.test.js"

  # ---------------------------------------------------------------------------
  # 安全扫描：依赖审计 + 密钥泄露扫描
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (for audit)
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ---------------------------------------------------------------------------
  # 打包校验：构建生产镜像（不推送）
  # ---------------------------------------------------------------------------
  package:
    name: Package (production image build)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          echo "VCS_REF=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "VERSION=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build Control API production image (build-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-api/Dockerfile.production
          platforms: linux/amd64
          push: false
          load: true
          tags: jingcang/control-api:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            VCS_REF=${{ steps.meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
