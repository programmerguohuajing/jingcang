name: Publish production containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        shell: bash
        run: |
          echo "VCS_REF=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Build and push Control API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-api/Dockerfile.production
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ env.VCS_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/programmerguohuajing/jingcang:${{ inputs.version }}
            ghcr.io/programmerguohuajing/jingcang:latest

      - name: Prepare Latest-only browser bundle
        shell: bash
        run: |
          docker pull selenium/standalone-chrome:latest
          docker pull selenium/standalone-edge:latest
          docker pull selenium/standalone-firefox:latest
          docker save -o deploy/browser-bundle/browsers.tar \
            selenium/standalone-chrome:latest \
            selenium/standalone-edge:latest \
            selenium/standalone-firefox:latest

      - name: Build and push Browser Bundle
        uses: docker/build-push-action@v6
        with:
          context: deploy/browser-bundle
          file: deploy/browser-bundle/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/programmerguohuajing/jingcang:browser-bundle-${{ inputs.version }}
            ghcr.io/programmerguohuajing/jingcang:browser-bundle-latest