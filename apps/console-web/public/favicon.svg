<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="jc-favicon-border" x1="16" y1="12" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="jc-favicon-bg" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="jc-fav-cyan" x1="24" y1="36" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="jc-fav-indigo" x1="96" y1="36" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="jc-fav-top" x1="36" y1="24" x2="84" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e0f2fe" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.5" />
    </linearGradient>
    <linearGradient id="jc-fav-lens" x1="50" y1="44" x2="70" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Capsule Chamber Pod -->
  <path
    d="M60 14
       C63.5 14 66.8 15.8 68.6 18.8
       L101.4 72.8
       C103.2 75.8 103.2 79.5 101.4 82.5
       L84.2 110.8
       C82.4 113.8 79.1 115.6 75.6 115.6
       H44.4
       C40.9 115.6 37.6 113.8 35.8 110.8
       L18.6 82.5
       C16.8 79.5 16.8 75.8 18.6 72.8
       L51.4 18.8
       C53.2 15.8 56.5 14 60 14 Z"
    fill="url(#jc-favicon-bg)"
    stroke="url(#jc-favicon-border)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Mirror Facet 1: Left Wing -->
  <path
    d="M60 32
       L32 74
       C31 75.5 32 77.5 34 78
       L52 82
       C54 82.5 56 81.5 57 79.5
       L68 54
       L60 32 Z"
    fill="url(#jc-fav-cyan)"
  />

  <!-- Mirror Facet 2: Right Wing -->
  <path
    d="M60 32
       L88 74
       C89 75.5 88 77.5 86 78
       L68 82
       C66 82.5 64 81.5 63 79.5
       L52 54
       L60 32 Z"
    fill="url(#jc-fav-indigo)"
  />

  <!-- Top Glass Viewport -->
  <path
    d="M60 22
       L78 50
       L60 62
       L42 50
       Z"
    fill="url(#jc-fav-top)"
  />

  <!-- Center Focal Core Lens -->
  <polygon
    points="60,42 72,56 60,70 48,56"
    fill="url(#jc-fav-lens)"
  />

  <!-- Specular Reflection Sparkle -->
  <path
    d="M60 47 L61.5 54 L68 55.5 L61.5 57 L60 64 L58.5 57 L52 55.5 L58.5 54 Z"
    fill="#ffffff"
  />
</svg>
