<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="full-border" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <linearGradient id="full-bg" x1="15" y1="15" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0b1329" />
    </linearGradient>

    <linearGradient id="full-cyan" x1="20" y1="25" x2="45" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#0284c7" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="full-indigo" x1="70" y1="25" x2="45" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a855f7" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#4338ca" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="full-top" x1="28" y1="18" x2="62" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f0fdf4" stop-opacity="0.5" />
      <stop offset="100%" stopColor="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="full-lens" x1="38" y1="34" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <linearGradient id="text-brand-grad" x1="175" y1="25" x2="270" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Left Icon (Transformed from 120x120 to fit within ~80x80) -->
  <g transform="translate(6, 5) scale(0.666)">
    <path
      d="M60 14
         C63.5 14 66.8 15.8 68.6 18.8
         L101.4 72.8
         C103.2 75.8 103.2 79.5 101.4 82.5
         L84.2 110.8
         C82.4 113.8 79.1 115.6 75.6 115.6
         H44.4
         C40.9 115.6 37.6 113.8 35.8 110.8
         L18.6 82.5
         C16.8 79.5 16.8 75.8 18.6 72.8
         L51.4 18.8
         C53.2 15.8 56.5 14 60 14 Z"
      fill="url(#full-bg)"
      stroke="url(#full-border)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path
      d="M60 16 L60 56 M18.6 77.6 L54 62 M101.4 77.6 L66 62"
      stroke="#334155"
      stroke-width="1.5"
      stroke-dasharray="2 3"
      stroke-opacity="0.7"
    />
    <path
      d="M60 32 L32 74 C31 75.5 32 77.5 34 78 L52 82 C54 82.5 56 81.5 57 79.5 L68 54 L60 32 Z"
      fill="url(#full-cyan)"
    />
    <path
      d="M60 32 L88 74 C89 75.5 88 77.5 86 78 L68 82 C66 82.5 64 81.5 63 79.5 L52 54 L60 32 Z"
      fill="url(#full-indigo)"
    />
    <path
      d="M60 22 L78 50 L60 62 L42 50 Z"
      fill="url(#full-top)"
    />
    <polygon
      points="60,42 72,56 60,70 48,56"
      fill="url(#full-lens)"
    />
    <circle cx="42" cy="50" r="2.5" fill="#38bdf8" />
    <circle cx="78" cy="50" r="2.5" fill="#c084fc" />
    <circle cx="60" cy="70" r="2.5" fill="#60a5fa" />
    <path
      d="M60 48 L61.5 54 L67.5 55.5 L61.5 57 L60 63 L58.5 57 L52.5 55.5 L58.5 54 Z"
      fill="#ffffff"
      opacity="0.9"
    />
  </g>

  <!-- Typography: Chinese "镜舱" -->
  <text
    x="96"
    y="46"
    fill="#f8fafc"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="1"
  >镜舱</text>

  <!-- Typography: Latin "JingCang" -->
  <text
    x="172"
    y="44"
    fill="url(#text-brand-grad)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="2.5"
  >JINGCANG</text>

  <!-- Subtitle / Tagline -->
  <text
    x="97"
    y="68"
    fill="#64748b"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12.5"
    font-weight="500"
    letter-spacing="0.8"
  >BROWSER POD CLOUD · 同一页面 多镜验证</text>
</svg>
